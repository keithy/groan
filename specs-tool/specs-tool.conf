# specs-tool conf
#
# Configures the specs sub-suite. Sub-tools under groan/ can declare
# a `specs/` or `tests/` directory containing bash-spec test scripts;
# `./groan specs run <tool>` executes the test suite found there, and
# `./groan specs run --all` runs every suite under groan/*/specs*.

c_description="spec/test runner for installed tools"

g_locations=(
	"${c_dir}/commands"
)
