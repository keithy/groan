# setup-utility conf
#
# Configures the setup-utility sub-suite. g_readConfig runs this
# after reading the parent tool's conf, so g_locations is
# populated with the right search dirs for this level's commands.

c_description="setup tool (setup-utility sub-suite)"

g_locations=(
	"${c_dir}/commands"
)

# Legacy variables expected by some sub-commands (e.g. new.cmd.sh).
# The framework no longer sets these by default; declare them so
# sub-commands using ${var+x} idiom under set -u don't fail.
g_config_preset_locations=(
	"${c_dir}"
)
